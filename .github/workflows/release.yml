name: Publish to NPM

on:
  release:
    # "published" rather than "created" so this also fires for releases that
    # were saved as a draft first, which "created" skips. It covers both
    # stable releases and prereleases.
    types: [published]

# NB: make publish fully automatic by following in the footsteps of https://github.com/Alexandrshy/como-north
# and/or straight to semantic-release cli (from npm)

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          always-auth: true
          node-version: 24
          registry-url: "https://npm.pkg.github.com"
          scope: "@noahm"
          cache: "yarn"
      - name: Install dependencies
        run: yarn --immutable
      - name: eslint
        run: yarn lint
      - name: tests
        run: yarn test

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: "yarn"
      - name: Install dependencies
        run: yarn --immutable

      # The dist-tag comes from the version being published rather than from
      # the release, so the two can never disagree: 0.10.0-beta.1 publishes
      # under "beta", 0.10.0-rc.1 under "rc", and a plain 0.10.0 under
      # "latest". Without this npm defaults everything to "latest", which
      # would point everyone installing the package at a prerelease.
      - name: Determine dist-tag
        id: dist_tag
        run: |
          version="$(node -p 'require("./package.json").version')"
          prerelease="${version#*-}"
          if [ "$prerelease" = "$version" ]; then
            tag="latest"
          else
            tag="${prerelease%%.*}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing $version under dist-tag '$tag'" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the release matches the version
        if: github.event.release.prerelease != (steps.dist_tag.outputs.tag != 'latest')
        run: |
          echo "::error::Release '${{ github.event.release.tag_name }}' is marked" \
            "prerelease=${{ github.event.release.prerelease }}, but version" \
            "${{ steps.dist_tag.outputs.version }} would publish to" \
            "'${{ steps.dist_tag.outputs.tag }}'. Fix the version or the release flag."
          exit 1

      - name: Build
        run: yarn build

      - name: Publish to NPM
        run: npm stage publish --provenance --tag "${{ steps.dist_tag.outputs.tag }}"
